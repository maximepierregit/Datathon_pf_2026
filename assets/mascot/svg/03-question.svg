<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340"><style>
.bob,.blink,.sway,.wave,.pump,.tap,.tilt,.scan,.twinkle,.float,.zzz,.dot,.pulse,.drip,.flutter{
 transform-box:fill-box;animation-delay:var(--d,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.bob{animation-name:pp-bob;animation-duration:3.6s}
.bob.slow{animation-name:pp-breathe;animation-duration:5s}
.bob.bouncy{animation-name:pp-hop;animation-duration:1.8s}
.blink{transform-origin:50% 50%;animation-name:pp-blink;animation-duration:5.2s;animation-timing-function:linear}
.sway{transform-origin:55% 0%;animation-name:pp-sway;animation-duration:3.6s}
.wave{transform-origin:50% 90%;animation-name:pp-wave;animation-duration:1.8s}
.pump{animation-name:pp-pump;animation-duration:2.4s}
.tap{animation-name:pp-tap;animation-duration:.9s}
.tilt{transform-origin:50% 50%;animation-name:pp-tilt;animation-duration:4s}
.scan{animation-name:pp-scan;animation-duration:4.4s}
.twinkle{transform-origin:50% 50%;animation-name:pp-twinkle;animation-duration:2.6s}
.float{animation-name:pp-float;animation-duration:3s}
.zzz{animation-name:pp-zzz;animation-duration:3.4s}
.dot{animation-name:pp-dot;animation-duration:1.6s}
.pulse{transform-origin:50% 50%;animation-name:pp-pulse;animation-duration:1.6s}
.drip{animation-name:pp-drip;animation-duration:3.2s;animation-timing-function:ease-in}
.flutter{transform-origin:0% 50%;animation-name:pp-flutter;animation-duration:2s}
.late{animation-delay:calc(var(--d,0s) - .45s)}
@keyframes pp-bob{50%{transform:translateY(-3px)}}
@keyframes pp-breathe{50%{transform:translateY(-1.5px) scaleY(1.01)}}
@keyframes pp-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}60%{transform:translateY(-5px)}}
@keyframes pp-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pp-sway{50%{transform:rotate(5deg)}}
@keyframes pp-wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes pp-pump{50%{transform:translateY(-4px)}}
@keyframes pp-tap{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-3px)}}
@keyframes pp-tilt{50%{transform:rotate(-2.5deg)}}
@keyframes pp-scan{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
@keyframes pp-twinkle{50%{transform:scale(.65) rotate(25deg);opacity:.55}}
@keyframes pp-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(6deg)}}
@keyframes pp-zzz{0%{transform:translate(0,6px);opacity:0}25%,70%{opacity:1}100%{transform:translate(6px,-8px);opacity:0}}
@keyframes pp-dot{0%,100%{opacity:.25}40%{opacity:1}}
@keyframes pp-pulse{50%{transform:scale(.85);opacity:.45}}
@keyframes pp-drip{0%{transform:translateY(-2px);opacity:0}20%{opacity:1}80%{transform:translateY(6px);opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes pp-flutter{50%{transform:scaleX(.92) skewY(5deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g style="--d:-0.00s"><g class="bob"><g transform="translate(170.0,178.0) rotate(-3) scale(0.95) translate(-108,-104)"><ellipse cx="84" cy="190" rx="16" ry="11" fill="#2c3360" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="154" cy="186" rx="16" ry="11" fill="#2c3360" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><g class="sway"><path d="M11.4,185.5 L18.0,184.6 A4.0,4.0 0 0 1 22.5,188.0 L25.5,210.2 A4.0,4.0 0 0 1 22.2,214.6 L12.7,216.2 A4.0,4.0 0 0 1 8.0,212.3 L8.0,189.5 A4.0,4.0 0 0 1 11.4,185.5 Z" fill="#a2262f" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><path d="M-5.1,182.8 L1.6,184.8 A4.0,4.0 0 0 1 4.2,190.2 L-4.5,210.4 A4.0,4.0 0 0 1 -9.6,212.6 L-19.4,208.8 A4.0,4.0 0 0 1 -21.4,202.9 L-9.6,184.5 A4.0,4.0 0 0 1 -5.1,182.8 Z" fill="#c22f39" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><path d="M-3,191 L-11,206" fill="none" stroke="#a2262f" stroke-width="3" stroke-linecap="round"/></g><path d="M9.3,30.3 L58.3,10.7 A14.0,14.0 0 0 1 71.1,11.9 L107.8,35.3 A10.0,10.0 0 0 0 116.6,36.3 L188.2,10.1 A14.0,14.0 0 0 1 206.9,21.8 L216.3,108.6 A22.0,22.0 0 0 1 204.0,130.7 L117.7,172.3 A26.0,26.0 0 0 1 101.6,174.4 L21.4,159.0 A20.0,20.0 0 0 1 5.2,140.3 L0.5,44.0 A14.0,14.0 0 0 1 9.3,30.3 Z" fill="#d63738"/><path d="M150,34 L184,21 Q195,17 196,28 L199,60" fill="none" stroke="#e8665d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/><path d="M172,26 L180,23" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".55"/><path d="M9.3,30.3 L58.3,10.7 A14.0,14.0 0 0 1 71.1,11.9 L107.8,35.3 A10.0,10.0 0 0 0 116.6,36.3 L188.2,10.1 A14.0,14.0 0 0 1 206.9,21.8 L216.3,108.6 A22.0,22.0 0 0 1 204.0,130.7 L117.7,172.3 A26.0,26.0 0 0 1 101.6,174.4 L21.4,159.0 A20.0,20.0 0 0 1 5.2,140.3 L0.5,44.0 A14.0,14.0 0 0 1 9.3,30.3 Z" fill="none" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-4,134,100)"><path d="M134,48 C175,48 196,64 196,100 C196,136 175,152 134,152 C92,160 72,142 72,100 C72,64 93,48 134,48 Z" fill="#fdf5ea"/><ellipse cx="96" cy="122" rx="9" ry="5" fill="#ef7f86" opacity=".4"/><ellipse cx="172" cy="122" rx="9" ry="5" fill="#ef7f86" opacity=".4"/><g class="blink"><ellipse cx="106" cy="102" rx="11.5" ry="16.5" fill="#1c2140"/><circle cx="102.5" cy="96" r="4.5" fill="#ffffff"/><circle cx="110" cy="108" r="2" fill="#ffffff"/><ellipse cx="162" cy="102" rx="11.5" ry="16.5" fill="#1c2140"/><circle cx="158.5" cy="96" r="4.5" fill="#ffffff"/><circle cx="166" cy="108" r="2" fill="#ffffff"/></g><path d="M127,126 Q134,132 141,126" fill="none" stroke="#1c2140" stroke-width="5.00" stroke-linejoin="round" stroke-linecap="round"/></g><path d="M212,118 C200,132 170,144 120,147 C80,149 34,150 12,158 C4,162 4,186 12,188 C30,187 60,185 96,185 C150,185 202,170 229,147 C237,140 238,118 228,110 C222,106 215,112 212,118 Z" fill="#c22f39" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><path d="M26,178 C52,175 80,174 104,174 C150,174 190,163 212,148" fill="none" stroke="#a2262f" stroke-width="4.5" stroke-linecap="round" opacity=".85"/><path d="M50,159 C84,158 120,157 156,151" fill="none" stroke="#d9454c" stroke-width="4" stroke-linecap="round"/><path d="M3.7,163.4 L13.7,162.7 A9.0,9.0 0 0 1 23.3,172.3 L22.5,182.3 A9.0,9.0 0 0 1 14.3,190.6 L6.5,191.3 A9.0,9.0 0 0 1 -3.2,183.6 L-4.6,173.6 A9.0,9.0 0 0 1 3.7,163.4 Z" fill="#c22f39" stroke="#1c2140" stroke-width="6.00" stroke-linejoin="round" stroke-linecap="round"/><path d="M4,172 Q9,177 8,184" fill="none" stroke="#a2262f" stroke-width="3" stroke-linecap="round"/></g></g><g class="float"><path transform="translate(286,74)" d="M-11,-8 C-11,-22 13,-22 13,-8 C13,1 2,3 2,12" fill="none" stroke="#1c2140" stroke-width="5.50" stroke-linejoin="round" stroke-linecap="round"/><circle cx="288" cy="98" r="4.5" fill="#1c2140"/></g></g></svg>
