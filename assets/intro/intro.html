<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>Intro BNCD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=block" rel="stylesheet">
<style>
  :root { --navy: #00314d; --red: #e41c23; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: "Plus Jakarta Sans", Arial, sans-serif; color: var(--navy);
  }
  #lockup { display: flex; align-items: center; }
  #bncd { font-size: 176px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  #slash { width: 14px; height: 168px; margin: 0 56px; border-radius: 7px; background: var(--red); }
  /* Le nom ne se voit qu'à droite de la barre, d'où il sort */
  #name { clip-path: polygon(0 -50%, 300% -50%, 300% 150%, 0 150%); }
  #name-text { display: block; font-size: 176px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  #pepite { width: 320px; height: 320px; margin-left: 32px; transform-origin: 50% 85%; }
  #pepite svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="lockup">
    <div id="bncd">BNCD</div>
    <div id="slash"></div>
    <div id="name"><span id="name-text">MonPort</span></div>
    <div id="pepite"></div>
  </div>
</div>
<script>
  // Animation pilotée par le temps : render.mjs appelle setup() puis renderFrame(t) pour chaque image.
  const $ = s => document.querySelector(s);
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const easeOutCubic = p => 1 - (1 - p) ** 3;
  const easeOutQuart = p => 1 - (1 - p) ** 4;
  const easeInOutCubic = p => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2);
  const easeOutBack = p => 1 + 2.70158 * (p - 1) ** 3 + 1.70158 * (p - 1) ** 2;

  const DURATION = 3;
  const WAVE_START = 1.65;
  const WAVE_SPEED = 2; // salut deux fois plus rapide que dans l'UI
  const BLINK_AT = 2.45;

  let offset = 0;
  let anims = [];

  window.setup = async (svg, name) => {
    $('#pepite').innerHTML = svg;
    $('#name-text').textContent = name;
    const faces = await Promise.all(
      ['800', '600'].map(w => document.fonts.load(`${w} 176px "Plus Jakarta Sans"`, 'BNCD ' + name)),
    );
    await document.fonts.ready;
    // Décalage qui centre BNCD seul au départ
    const r = $('#bncd').getBoundingClientRect();
    offset = innerWidth / 2 - (r.left + r.width / 2);
    anims = $('#pepite').getAnimations({ subtree: true });
    anims.forEach(a => a.pause());
    window.renderFrame(0);
    return { fontOk: faces.every(f => f.length > 0), offset, anims: anims.length };
  };

  window.renderFrame = t => {
    // BNCD apparaît au centre
    const pIn = easeOutCubic(seg(t, 0, 0.45));
    $('#bncd').style.opacity = pIn;
    $('#bncd').style.transform = `translateY(${(1 - pIn) * 28}px)`;

    // Le bloc glisse vers la gauche
    const pSlide = easeInOutCubic(seg(t, 0.8, 1.45));
    $('#lockup').style.transform = `translateX(${offset * (1 - pSlide)}px)`;

    // La barre pousse, puis le nom sort de derrière
    $('#slash').style.transform = `scaleY(${easeOutCubic(seg(t, 0.98, 1.38))})`;
    $('#name-text').style.transform = `translateX(${(easeOutQuart(seg(t, 1.1, 1.75)) - 1) * 105}%)`;

    // Pépite arrive en rebondissant
    const pPop = seg(t, 1.55, 2.1);
    const land = 1 - easeOutCubic(pPop);
    $('#pepite').style.opacity = seg(t, 1.55, 1.65);
    $('#pepite').style.transform = `translateY(${land * 50}px) rotate(${land * -14}deg) scale(${easeOutBack(pPop)})`;

    // Légère poussée de caméra
    $('#stage').style.transform = `scale(${1 + 0.02 * easeInOutCubic(t / DURATION)})`;

    // Animations propres au SVG de Pépite, calées sur t
    const waveMs = Math.max(0, t - WAVE_START) * 1000 * WAVE_SPEED;
    for (const a of anims) {
      if (a.animationName === 'pp-wave') a.currentTime = waveMs;
      else if (a.animationName === 'pp-pulse') a.currentTime = waveMs * (1600 / 1800);
      else if (a.animationName === 'pp-blink') a.currentTime = (t - BLINK_AT) * 1000 + 4940;
      else a.currentTime = t * 1000;
    }
  };
</script>
</body>
</html>
