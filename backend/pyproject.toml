[project]
name = "invest-agents"
version = "0.1.0"
description = "Pipeline multi-agents de profil d'investisseur (Strands Agents + Bedrock AgentCore)"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.65",
    "bedrock-agentcore>=1.26",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",  # optimizer.estimate_covariance: retrait Ledoit-Wolf
    "boto3>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
