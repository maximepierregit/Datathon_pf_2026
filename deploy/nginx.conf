# Bas de Laine : sert le build Vite du front. Installé dans /etc/nginx/conf.d/ par deploy.sh.

# L'API est publique et sans authentification : chaque appel coûte des appels Bedrock.
# Un parcours complet en fait deux (vérification, construction).
limit_req_zone $binary_remote_addr zone=monport_api:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/bas-de-laine;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers hashés par Vite : leur nom change à chaque build, on peut les garder en cache longtemps.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # BrowserRouter : une route inconnue (ex. rafraîchir /resultats) retombe sur index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Backend des agents (deploy-backend.sh), /api/invocations -> 127.0.0.1:8091/invocations.
    # Flux SSE d'une à deux minutes : pas de tampon, long délai. Sans backend, nginx répond 502
    # et le front rejoue son script d'exemple.
    location /api/ {
        limit_req zone=monport_api burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
