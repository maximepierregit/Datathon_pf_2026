# Bas de Laine : sert le build Vite du front. Installé dans /etc/nginx/conf.d/ par deploy.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/bas-de-laine;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers hashés par Vite : leur nom change à chaque build, on peut les garder en cache longtemps.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # BrowserRouter : une route inconnue (ex. rafraîchir /resultats) retombe sur index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Le jour où le backend arrive :
    # location /api/ { proxy_pass http://127.0.0.1:8000; }
}
